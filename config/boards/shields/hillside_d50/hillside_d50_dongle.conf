CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=7

CONFIG_ZMK_SLEEP=n
# Keep the desktop companion visible during reading and short typing breaks.
# Keyboard inactivity is a proxy for absence; blank after 15 minutes.
CONFIG_ZMK_IDLE_TIMEOUT=900000

CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=6
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=3

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
CONFIG_PROSPECTOR_MODIFIER_OS_MAC=y

# Dongle Display UI: Classic is the module default. Uncomment one option to
# pick another for the standard dongle target; the dedicated
# hillside_d50_dongle_vaporwave target in build.yaml selects Vaporwave via
# cmake-args.
# CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y

# Soft-off is a battery feature for the halves, not the USB-powered dongle:
# leaving it on pulls in PM_DEVICE + ZMK_PM_DEVICE_SUSPEND_RESUME, which can
# suspend the ST7789v panel on idle without a resume path. config/hillside_d50.conf
# sets ZMK_PM_SOFT_OFF=y and is merged last, so the dongle targets in build.yaml
# disable both via cmake-args instead.
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_PM_DEVICE=n
